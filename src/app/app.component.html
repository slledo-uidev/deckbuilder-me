<div class="app">
  <header class="app__header" [class.app__header--hidden]="headerHidden" *ngIf="!isLoginPage">
    <div class="app__container">
      <div class="app__header-content">
        <div class="app__header-title">
          <h1 class="app__title">ME Deck Archive</h1>
        </div>
        <app-nav-bar class="app__nav"></app-nav-bar>
      </div>
    </div>
  </header>
  
  <main class="app__main" [class.app__main--full]="isLoginPage">
    <router-outlet></router-outlet>
  </main>
  
  <footer class="app__footer" *ngIf="!isLoginPage">
    <div class="app__container">
      <p class="app__footer-text">
        Built for the Digimon TCG community | Data from 
        <a href="https://digimoncard.dev" target="_blank" rel="noopener">DigimonCard.dev</a>
      </p>
    </div>
  </footer>
</div>
