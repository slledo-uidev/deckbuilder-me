<div class="section-title section-title--{{ variant }}">
  <h2 *ngIf="level === 'h2'" class="section-title__heading">
    {{ title }}
    <span *ngIf="count !== undefined" class="section-title__count">({{ count }})</span>
  </h2>
  <h3 *ngIf="level === 'h3'" class="section-title__heading">
    {{ title }}
    <span *ngIf="count !== undefined" class="section-title__count">({{ count }})</span>
  </h3>
  <h4 *ngIf="level === 'h4'" class="section-title__heading">
    {{ title }}
    <span *ngIf="count !== undefined" class="section-title__count">({{ count }})</span>
  </h4>
</div>
