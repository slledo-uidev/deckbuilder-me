<div class="deck-stats-panel">
  <!-- Panel Header -->
  <app-section-header
    title="Deck Statistics"
    subtitle="Visual analysis of your deck composition"
    icon="📊" />

  <!-- Empty State -->
  <div *ngIf="!hasData" class="deck-stats-panel__empty">
    <p class="deck-stats-panel__empty-text">
      Add cards to your deck to see statistics and visualizations
    </p>
  </div>

  <!-- Statistics Content -->
  <div *ngIf="hasData" class="deck-stats-panel__content">
    <!-- Quick Stats -->
    <div class="deck-stats-panel__quick-stats">
      <app-stat-item label="Average Cost" [value]="averageCost" layout="vertical" size="large" />
      <app-stat-item label="Average Level" [value]="averageLevel" layout="vertical" size="large" />
      <app-stat-item label="Total Cards" [value]="totalCards" layout="vertical" size="large" />
      <app-stat-item
        *ngIf="costGaps.length > 0"
        label="Cost Gaps"
        [value]="costGaps.length"
        status="warning"
        layout="vertical"
        size="large" />
    </div>

    <!-- Cost Gaps Warning -->
    <app-alert
      *ngIf="costGaps.length > 0"
      title="Cost Curve Gaps Detected"
      [message]="'Missing cards at costs: ' + costGaps.join(', ')"
      icon="⚠️"
      variant="warning"
      size="medium" />

    <!-- Charts Grid -->
    <div class="deck-stats-panel__charts">
      <!-- Cost Curve Chart -->
      <div class="deck-stats-panel__chart-container">
        <app-section-title title="Cost Curve" level="h4" />
        <div class="deck-stats-panel__chart">
          <canvas baseChart
            [data]="costCurveChartData"
            [options]="costCurveChartOptions"
            [type]="costCurveChartType">
          </canvas>
        </div>
      </div>

      <!-- Color Distribution Chart -->
      <div class="deck-stats-panel__chart-container">
        <app-section-title title="Color Distribution" level="h4" />
        <div class="deck-stats-panel__chart">
          <canvas baseChart
            [data]="colorDistributionChartData"
            [options]="colorDistributionChartOptions"
            [type]="colorDistributionChartType">
          </canvas>
        </div>
      </div>

      <!-- Type Distribution Chart -->
      <div class="deck-stats-panel__chart-container">
        <app-section-title title="Type Distribution" level="h4" />
        <div class="deck-stats-panel__chart">
          <canvas baseChart
            [data]="typeDistributionChartData"
            [options]="typeDistributionChartOptions"
            [type]="typeDistributionChartType">
          </canvas>
        </div>
      </div>
    </div>

    <!-- Type Breakdown Table -->
    <div class="deck-stats-panel__breakdown">
      <h4 class="deck-stats-panel__breakdown-title">Card Type Breakdown</h4>
      <div class="deck-stats-panel__breakdown-grid">
        <div *ngFor="let item of typeBreakdown" class="deck-stats-panel__breakdown-item">
          <span class="deck-stats-panel__breakdown-label">{{ item.type }}</span>
          <div class="deck-stats-panel__breakdown-bar">
            <div class="deck-stats-panel__breakdown-fill" 
                 [style.width.%]="item.percentage">
            </div>
          </div>
          <span class="deck-stats-panel__breakdown-value">
            {{ item.count }} ({{ item.percentage }}%)
          </span>
        </div>
      </div>
    </div>
  </div>
</div>
