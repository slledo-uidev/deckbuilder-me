<div class="card-grid">
  <!-- Loading State -->
  <div *ngIf="loading" class="card-grid__loading">
    <p>Loading cards...</p>
  </div>
  
  <!-- Empty State -->
  <div *ngIf="!loading && cards.length === 0" class="card-grid__empty">
    <p>{{ emptyMessage }}</p>
  </div>
  
  <!-- Card Grid -->
  <div *ngIf="!loading && cards.length > 0">
    <div class="card-grid__container" [class.card-grid__container--view]="mode === 'view'">
      <div
        *ngFor="let card of displayedCards"
        class="card-grid__item"
        [ngClass]="getCardColorClass(card)"
        (click)="onAddCard(card)"
        [attr.aria-label]="(mode === 'view' ? 'View ' : 'Add ') + card.name"
        tabindex="0"
        role="button"
      >
        <div class="card-grid__image-container">
          <img
            class="card-grid__image"
            [src]="card.imageUrl"
            [alt]="card.name"
            loading="lazy"
            (error)="onImageError($event)"
          />
        </div>
        
        <div class="card-grid__info">
          <h4 class="card-grid__name">{{ card.name }}</h4>
          <p class="card-grid__set">{{ card.set }}</p>
          <p class="card-grid__id">{{ card.id }}</p>
          
          <div class="card-grid__meta">
            <div class="row">
              <app-badge
                class="app-badge"
                [variant]="getTypeBadgeVariant(card.type)"
                size="small"
              >
                {{ card.type }}
              </app-badge>
            </div>
            <div class="row">
              <app-badge
                *ngFor="let color of card.color"
                class="app-badge"
                [variant]="getColorBadgeVariant(color)"
                size="small"
              >
                {{ color }}
              </app-badge>
            </div>
          </div>
        </div>
      </div>
    </div>
    
    <!-- Load More Trigger (invisible) -->
    <div 
      *ngIf="hasMoreCards" 
      #loadMoreTrigger
      class="card-grid__load-trigger"
    >
      <div class="card-grid__loading-indicator">
        <p *ngIf="isLoadingMore">Loading more cards...</p>
        <p *ngIf="!isLoadingMore">Scroll for more ({{ remainingCardsCount }} remaining)</p>
      </div>
    </div>
  </div>
</div>
