<div class="validation-panel" 
     [class.validation-panel--valid]="statusClass === 'valid'"
     [class.validation-panel--error]="statusClass === 'error'"
     [class.validation-panel--warning]="statusClass === 'warning'"
     [class.validation-panel--collapsed]="!isExpanded">
  
  <!-- Panel Header -->
  <app-collapsible-header
    title="Deck Validation"
    [subtitle]="statusText"
    [isExpanded]="isExpanded"
    [status]="statusClass"
    (toggle)="toggleExpanded()" />

  <!-- Panel Content -->
  <div class="validation-panel__content" *ngIf="isExpanded && validation">
    <!-- Deck Summary -->
    <div class="validation-panel__summary">
      <app-stat-item label="Total Cards:" [value]="totalCards" layout="horizontal" size="medium" />
      <app-stat-item label="Digi-Eggs:" [value]="digiEggsCount + '/5'" layout="horizontal" size="medium" />
      <app-stat-item label="Main Deck:" [value]="mainDeckCount + '/50'" layout="horizontal" size="medium" />
      <app-stat-item label="Side Deck:" [value]="sideDeckCount" layout="horizontal" size="medium" />
    </div>

    <!-- Errors Section -->
    <div class="validation-panel__section" *ngIf="validation.errors.length > 0">
      <app-section-title
        title="Errors"
        [count]="validation.errors.length"
        level="h4"
        variant="error" />
      <ul class="validation-panel__list">
        <li *ngFor="let error of validation.errors" class="validation-panel__item validation-panel__item--error">
          <span class="validation-panel__item-icon">✗</span>
          <div class="validation-panel__item-content">
            <p class="validation-panel__item-message">{{ error.message }}</p>
            <span class="validation-panel__item-code" *ngIf="error.field">{{ error.field }}</span>
          </div>
        </li>
      </ul>
    </div>

    <!-- Warnings Section -->
    <div class="validation-panel__section" *ngIf="validation.warnings.length > 0">
      <app-section-title
        title="Warnings"
        [count]="validation.warnings.length"
        level="h4"
        variant="warning" />
      <ul class="validation-panel__list">
        <li *ngFor="let warning of validation.warnings" class="validation-panel__item validation-panel__item--warning">
          <span class="validation-panel__item-icon">!</span>
          <div class="validation-panel__item-content">
            <p class="validation-panel__item-message">{{ warning.message }}</p>
            <span class="validation-panel__item-code" *ngIf="warning.field">{{ warning.field }}</span>
          </div>
        </li>
      </ul>
    </div>

    <!-- Success Message -->
    <div class="validation-panel__success" *ngIf="validation.isValid">
      <span class="validation-panel__success-icon">✓</span>
      <p class="validation-panel__success-message">
        Your deck is valid and ready to save!
      </p>
    </div>
  </div>
</div>
