<nav class="nav-bar">
  <ul class="nav-bar__list">
    <li 
      *ngFor="let item of navItems" 
      class="nav-bar__item">
      <a 
        [routerLink]="item.path" 
        routerLinkActive="nav-bar__link--active"
        class="nav-bar__link">
        <span class="nav-bar__label">{{ item.label }}</span>
      </a>
    </li>
  </ul>

  <div class="nav-bar__user" *ngIf="currentUser">
    <button 
      class="nav-bar__user-button"
      (click)="toggleUserMenu()"
      [class.nav-bar__user-button--active]="isUserMenuOpen">
      <lucide-angular name="user" [size]="24" class="nav-bar__user-icon"></lucide-angular>
      <!-- <span class="nav-bar__username">{{ currentUser.displayName }}</span>
      <lucide-angular name="chevron-down" [size]="16" class="nav-bar__chevron" [class.nav-bar__chevron--open]="isUserMenuOpen"></lucide-angular> -->
    </button>

    <div class="nav-bar__dropdown" *ngIf="isUserMenuOpen">
      <div class="nav-bar__dropdown-header">
        <span class="nav-bar__dropdown-name">{{ currentUser.displayName }}</span>
        <span class="nav-bar__dropdown-username">{{ currentUser.email }}</span>
      </div>
      <button class="nav-bar__dropdown-item" (click)="openSettings()">
        <lucide-angular name="settings" [size]="18" class="nav-bar__dropdown-icon"></lucide-angular>
        <span>Settings</span>
      </button>
      <button class="nav-bar__dropdown-item" (click)="onLogout()">
        <lucide-angular name="log-out" [size]="18" class="nav-bar__dropdown-icon"></lucide-angular>
        <span>Cerrar sesión</span>
      </button>
    </div>
  </div>
</nav>
