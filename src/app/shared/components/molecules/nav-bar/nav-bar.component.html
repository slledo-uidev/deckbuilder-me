<nav class="nav-bar">
  <ul class="nav-bar__list">
    <li 
      *ngFor="let item of navItems" 
      class="nav-bar__item">
      <a 
        [routerLink]="item.path" 
        routerLinkActive="nav-bar__link--active"
        class="nav-bar__link">
        <span class="nav-bar__label">{{ item.label }}</span>
      </a>
    </li>
  </ul>

  <div class="nav-bar__user" *ngIf="currentUser">
    <span class="nav-bar__username">{{ currentUser.displayName }}</span>
    <app-button 
      variant="outline" 
      size="small"
      (clicked)="onLogout()"
      class="nav-bar__logout">
      Cerrar sesión
    </app-button>
  </div>
</nav>
