<div class="deck-zone" [class.deck-zone--digi-eggs]="zoneType === 'digi-eggs'" 
     [class.deck-zone--main]="zoneType === 'main'" 
     [class.deck-zone--side]="zoneType === 'side'">
  
  <!-- Zone Header -->
  <div class="deck-zone__header">
    <h3 class="deck-zone__title">{{ title }}</h3>
    <app-status-badge
      [current]="totalCards"
      [max]="maxCards > 0 ? maxCards : undefined"
      [status]="statusClass"
      size="medium" />
  </div>

  <!-- Empty State -->
  <app-empty-state
    *ngIf="isEmpty || deckCards.length === 0"
    [message]="emptyMessage"
    icon="📦"
    size="medium" />

  <!-- Cards List -->
  <div *ngIf="!isEmpty && deckCards.length > 0" class="deck-zone__cards">
    <div *ngFor="let deckCard of deckCards" 
         class="deck-zone__card"
         [class.deck-zone__card--red]="getCardColorClass(deckCard.card.color) === 'red'"
         [class.deck-zone__card--blue]="getCardColorClass(deckCard.card.color) === 'blue'"
         [class.deck-zone__card--yellow]="getCardColorClass(deckCard.card.color) === 'yellow'"
         [class.deck-zone__card--green]="getCardColorClass(deckCard.card.color) === 'green'"
         [class.deck-zone__card--black]="getCardColorClass(deckCard.card.color) === 'black'"
         [class.deck-zone__card--purple]="getCardColorClass(deckCard.card.color) === 'purple'"
         [class.deck-zone__card--white]="getCardColorClass(deckCard.card.color) === 'white'">
      
      <div class="deck-zone__card-image">
        <img [src]="deckCard.card.imageUrl" 
             [alt]="deckCard.card.name"
             class="deck-zone__card-img">
      </div>

      <div class="deck-zone__card-info">
        <span class="deck-zone__card-name">{{ deckCard.card.name }}</span>
        <app-card-meta
          [type]="deckCard.card.type"
          [code]="deckCard.card.id"
          size="small" />
      </div>

      <div class="deck-zone__card-controls">
        <app-quantity-stepper
          [value]="deckCard.quantity"
          [min]="1"
          [increaseDisabled]="isIncreaseDisabled(deckCard)"
          (decrease)="onDecreaseQuantity(deckCard.card)"
          (increase)="onIncreaseQuantity(deckCard.card)"
          size="medium" />
        <button 
          class="deck-zone__btn-remove" 
          (click)="onRemoveCard(deckCard.card)"
          aria-label="Remove card">
          Remove
        </button>
      </div>
    </div>
  </div>
</div>
