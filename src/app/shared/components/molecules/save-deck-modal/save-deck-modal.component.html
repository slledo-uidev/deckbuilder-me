<div
  *ngIf="isVisible"
  class="save-deck-modal__backdrop"
  (click)="onBackdropClick($event)"
  (keydown)="onKeydown($event)">

  <div class="save-deck-modal__dialog" role="dialog" aria-modal="true" aria-labelledby="save-modal-title">
    <div class="save-deck-modal__header">
      <h3 class="save-deck-modal__title" id="save-modal-title">Save Deck</h3>
      <button class="save-deck-modal__close" (click)="onCancel()" aria-label="Close">&#x2715;</button>
    </div>

    <div class="save-deck-modal__body">
      <label class="save-deck-modal__label" for="deck-name-input">Deck Name</label>
      <input
        id="deck-name-input"
        class="save-deck-modal__input"
        [class.save-deck-modal__input--error]="nameError"
        type="text"
        [(ngModel)]="deckName"
        placeholder="e.g. Greymon Aggro 2026"
        maxlength="60"
        autofocus
        (keydown)="onKeydown($event)"
      />
      <span *ngIf="nameError" class="save-deck-modal__error">{{ nameError }}</span>
      <span class="save-deck-modal__char-count">{{ deckName.length }}/60</span>
    </div>

    <div class="save-deck-modal__footer">
      <app-button variant="outline" (clicked)="onCancel()">Cancel</app-button>
      <app-button variant="primary" (clicked)="onConfirm()">Save Deck</app-button>
    </div>
  </div>
</div>
