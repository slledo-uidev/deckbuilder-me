<div class="filter-panel">
  <div class="filter-panel__header">
    <h3 class="filter-panel__title">Advanced Filters</h3>
    <div class="filter-panel__actions">
      <app-button
        variant="ghost"
        size="small"
        (clicked)="clearFilters()"
      >
        Clear All
      </app-button>
    </div>
  </div>
  
  <div class="filter-panel__content">
    <!-- Colors Section -->
    <div class="filter-panel__section">
      <label for="color-select" class="filter-panel__label">Colors</label>
      <div class="filter-panel__input-wrapper">
        <select 
          id="color-select"
          class="filter-panel__input filter-panel__input--dropdown" 
          (change)="onColorChange($event)"
          [ngModel]="selectedColors[0] || ''">
          <option value="">All Colors</option>
          <option *ngFor="let color of colors" [value]="color">
            {{ color }}
          </option>
        </select>
      </div>
    </div>
    
    <!-- Set Section -->
    <div class="filter-panel__section">
      <label for="set-select" class="filter-panel__label">Expansion Set</label>
      <div class="filter-panel__input-wrapper">
        <select 
          id="set-select"
          class="filter-panel__input filter-panel__input--dropdown" 
          (change)="onSetChange($event)"
          [ngModel]="selectedSets[0] || ''">
          <option value="">All Sets</option>
          <option *ngFor="let set of availableSets" [value]="set">
            {{ set }}
          </option>
        </select>
      </div>
    </div>
    
    <!-- Rarity Section -->
    <div class="filter-panel__section">
      <label for="rarity-select" class="filter-panel__label">Rarity</label>
      <div class="filter-panel__input-wrapper">
        <select 
          id="rarity-select"
          class="filter-panel__input filter-panel__input--dropdown" 
          (change)="onRarityChange($event)"
          [ngModel]="selectedRarities[0] || ''">
          <option value="">All Rarities</option>
          <option *ngFor="let rarity of rarities" [value]="rarity">
            {{ rarity }}
          </option>
        </select>
      </div>
    </div>
    
    <!-- Type Section -->
    <div class="filter-panel__section">
      <label for="type-select" class="filter-panel__label">Card Type</label>
      <div class="filter-panel__input-wrapper">
        <select 
          id="type-select"
          class="filter-panel__input filter-panel__input--dropdown" 
          (change)="onTypeChange($event)"
          [ngModel]="selectedTypes[0] || ''">
          <option value="">All Types</option>
          <option *ngFor="let type of types" [value]="type">
            {{ type }}
          </option>
        </select>
      </div>
    </div>
    
    <!-- Cost Section -->
    <div class="filter-panel__section">
      <label for="cost-select" class="filter-panel__label">Play Cost</label>
      <div class="filter-panel__input-wrapper">
        <select 
          id="cost-select"
          class="filter-panel__input filter-panel__input--dropdown" 
          (change)="onCostChange($event)"
          [ngModel]="selectedCost !== undefined ? selectedCost : ''">
          <option value="">Any Cost</option>
          <option *ngFor="let cost of costs" [value]="cost">
            {{ cost }}
          </option>
        </select>
      </div>
    </div>
    
    <!-- Level Section -->
    <div class="filter-panel__section">
      <label for="level-select" class="filter-panel__label">Level</label>
      <div class="filter-panel__input-wrapper">
        <select 
          id="level-select"
          class="filter-panel__input filter-panel__input--dropdown" 
          (change)="onLevelChange($event)"
          [ngModel]="selectedLevel !== undefined ? selectedLevel : ''">
          <option value="">Any Level</option>
          <option *ngFor="let level of levels" [value]="level">
            Level {{ level }}
          </option>
        </select>
      </div>
    </div>
    
  </div>
  <!-- Apply Filters Button -->
  <div class="filter-panel__section filter-panel__section--actions">
    <app-button
      variant="primary"
      size="medium"
      (clicked)="applyFilters()"
      class="filter-panel__apply-button"
    >
      Apply Filters
    </app-button>
  </div>
</div>
