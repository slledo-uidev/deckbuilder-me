<div class="deck-builder">
  <div class="deck-builder__container">
    <!-- Header -->
    <header class="deck-builder__header">
      <div class="deck-builder__header-info">
        <h1 class="deck-builder__title">Digimon TCG Deck Builder</h1>
        <span *ngIf="currentDeckId" class="deck-builder__active-deck">{{ deckName }}</span>
      </div>
      <div class="deck-builder__header-actions">
        <app-button variant="outline" size="small" (clicked)="newDeck()">New Deck</app-button>
        <app-button variant="outline" size="small" (clicked)="toggleDeckList()">
          My Decks ({{ savedDecks.length }})
        </app-button>
        <app-button variant="secondary" size="small" (clicked)="exportCurrentDeck()">Export</app-button>
        <app-button variant="primary" size="small" (clicked)="openSaveModal()">Save Deck</app-button>
      </div>
    </header>

    <!-- Success notification -->
    <div *ngIf="saveSuccessMessage" class="deck-builder__notify">
      {{ saveSuccessMessage }}
    </div>

    <!-- Save deck modal -->
    <app-save-deck-modal
      [isVisible]="showSaveModal"
      [currentName]="deckName"
      (save)="onSaveConfirm($event)"
      (cancel)="onSaveCancel()">
    </app-save-deck-modal>

    <!-- Deck list panel -->
    <div *ngIf="showDeckList" class="deck-builder__deck-list-section">
      <app-deck-list-panel
        [decks]="savedDecks"
        [activeDeckId]="currentDeckId"
        (loadDeck)="onLoadDeck($event)"
        (deleteDeck)="onDeleteDeck($event)"
        (duplicateDeck)="onDuplicateDeck($event)"
        (exportDeck)="onExportDeck($event)">
      </app-deck-list-panel>
    </div>

    <!-- Filters Section (Top, Collapsible) -->
    <div class="deck-builder__filters-section">
      <div class="deck-builder__filters-header">
        <div class="deck-builder__search-bar">
          <app-search-bar
            placeholder="Search cards by name..."
            (searchChange)="onSearchChange($event)">
          </app-search-bar>
        </div>
        <div class="deck-builder__filters-controls">
          <button
            class="deck-builder__filters-toggle"
            (click)="toggleFilters()"
            [attr.aria-expanded]="filtersExpanded"
            aria-label="Toggle advanced filters">
            {{ filtersExpanded ? 'Hide Filters' : 'Show Filters' }} 
            <span *ngIf="getActiveFilterCount() > 0" class="deck-builder__filters-badge">
              {{ getActiveFilterCount() }}
            </span>
            {{ filtersExpanded ? '▲' : '▼' }}
          </button>
          <button
            class="deck-builder__filters-reset"
            (click)="onFilterClear()"
            [disabled]="getActiveFilterCount() === 0"
            title="Reset all filters"
            aria-label="Reset filters">
            🔄
          </button>
        </div>
      </div>
      
      <div 
        class="deck-builder__filters-content" 
        [class.deck-builder__filters-content--expanded]="filtersExpanded">
        <div class="deck-builder__filters-inner">
          <app-filter-panel
            (filterChange)="onFilterChange($event)"
            (filterClear)="onFilterClear()">
          </app-filter-panel>
        </div>
      </div>
    </div>

    <!-- Main Layout: 2 columns -->
    <div class="deck-builder__layout">
      
      <!-- LEFT: Card Results -->
      <main class="deck-builder__main">
        <!-- Card Results Section -->
        <section class="deck-builder__card-results">
          <div class="deck-builder__results-header">
            <h2 class="deck-builder__section-title">Card Results</h2>
            <app-badge variant="info" size="medium">
              {{ filteredCards.length }} cards
            </app-badge>
          </div>
          <div class="deck-builder__results-scroll">
            <app-card-grid
              [cards]="filteredCards"
              [loading]="loading"
              [emptyMessage]="searchText || currentFilter.colors?.length ? 'No cards match your filters' : 'Use filters to find cards'"
              (cardClick)="onCardClick($event)"
              (cardAdd)="onCardAdd($event)">
            </app-card-grid>
          </div>
        </section>
      </main>

      <!-- RIGHT: Your Deck -->
      <aside class="deck-builder__deck-sidebar">
        <section class="deck-builder__deck-construction">
          <div class="deck-builder__deck-header">
            <h2 class="deck-builder__section-title">Your Deck</h2>
            <div class="deck-builder__zone-info">
              <span class="deck-builder__zone-hint">Level 2 cards → Digi-Eggs | Others → Main Deck</span>
            </div>
          </div>

          <!-- Deck Zones Grid -->
          <div class="deck-builder__zones">
            <app-deck-zone
              title="Digi-Eggs"
              [deckCards]="digiEggs"
              [maxCards]="5"
              [zoneType]="'digi-eggs'"
              [isEmpty]="digiEggs.length === 0"
              (removeCard)="removeCardFromZone($event, 'digi-eggs')"
              (increaseQuantity)="increaseCardQuantity($event, 'digi-eggs')"
              (decreaseQuantity)="decreaseCardQuantity($event, 'digi-eggs')">
            </app-deck-zone>
            
            <app-deck-zone
              title="Main Deck"
              [deckCards]="mainDeck"
              [maxCards]="50"
              [zoneType]="'main'"
              [isEmpty]="mainDeck.length === 0"
              (removeCard)="removeCardFromZone($event, 'main')"
              (increaseQuantity)="increaseCardQuantity($event, 'main')"
              (decreaseQuantity)="decreaseCardQuantity($event, 'main')">
            </app-deck-zone>
          </div>

          <!-- Validation & Stats Tabs -->
          <div class="deck-builder__deck-info">
            <app-validation-panel
              [digiEggs]="digiEggs"
              [mainDeck]="mainDeck"
              [deckName]="'Current Deck'">
            </app-validation-panel>

            <app-deck-stats-panel
              [digiEggs]="digiEggs"
              [mainDeck]="mainDeck">
            </app-deck-stats-panel>
          </div>
        </section>
      </aside>
    </div>
  </div>
</div>
