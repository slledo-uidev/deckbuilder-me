<div class="card-gallery">
  <!-- Loading State -->
  <div *ngIf="loading" class="card-gallery__loading">
    <p>Loading cards...</p>
  </div>

  <!-- Error State -->
  <div *ngIf="error && !loading" class="card-gallery__error">
    <app-alert type="error" [message]="error"></app-alert>
  </div>

  <!-- Main Content -->
  <div *ngIf="!loading && !error" class="card-gallery__content">
    
    <!-- Filters Section (Top, Full Width, Collapsible) -->
    <div class="card-gallery__filters-section">
      <div class="card-gallery__filters-header">
        <div class="card-gallery__search-bar">
          <app-search-bar
            placeholder="Search cards by name..."
            (searchChange)="onSearchChange($event)">
          </app-search-bar>
        </div>
        <div class="card-gallery__filters-controls">
        <app-button variant="outline" size="medium" [attr.aria-expanded]="filtersExpanded" (click)="toggleFilters()">
            {{ filtersExpanded ? 'Hide Filters' : 'Show Filters' }} 
            <span *ngIf="getActiveFilterCount() > 0" class="deck-builder__filters-badge">
              {{ getActiveFilterCount() }}
            </span>
            {{ filtersExpanded ? '▲' : '▼' }}
        </app-button>
        <app-button
          variant="outline" 
          size="square" 
          (click)="onFilterClear()"
          [disabled]="getActiveFilterCount() === 0"
          title="Reset all filters"
          aria-label="Reset filters"
         >
            <lucide-angular name="rotate-ccw" [size]="16" class="lucide-icon"></lucide-angular>
        </app-button>
        </div>
      </div>
      
      <div 
        class="card-gallery__filters-content" 
        [class.card-gallery__filters-content--expanded]="filtersExpanded">
        <div class="card-gallery__filters-inner">
          <app-filter-panel
            (filterChange)="onFilterChange($event)"
            (filterClear)="onFilterClear()">
          </app-filter-panel>
        </div>
      </div>
    </div>

    <!-- Results Section -->
    <section class="card-gallery__results">
      <div class="card-gallery__results-header">
        <h2 class="card-gallery__section-title">Card Results</h2>
        <app-badge variant="info" size="medium">
          {{ filteredCards.length }} cards
        </app-badge>
      </div>

      <div class="card-gallery__results-body">
        <!-- Card Grid -->
        <app-card-grid
          [cards]="filteredCards"
          [loading]="loading"
          [mode]="'view'"
          (cardClick)="onCardClick($event)" />
      </div>
    </section>

  </div>
</div>

<app-card-viewer-modal
  [isVisible]="isCardViewerOpen"
  [card]="selectedCard"
  (close)="onCardViewerClose()">
</app-card-viewer-modal>
