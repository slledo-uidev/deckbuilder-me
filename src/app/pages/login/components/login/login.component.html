<div class="login">
  <div class="login__panel">

    <!-- ══ PANEL IZQUIERDO — ILUSTRACIÓN ══════════════════════════════════ -->
    <app-auth-visual></app-auth-visual>

    <!-- ══ PANEL DERECHO — FORMULARIO ═════════════════════════════════════ -->
    <div class="login__form-panel">

      <div class="login__logo">
        <lucide-angular name="layers" [size]="28" class="login__logo-icon"></lucide-angular>
        <span class="login__logo-text">Deck Archive</span>
      </div>

      <div class="login__header">
        <h1 class="login__title">Bienvenido</h1>
        <p class="login__subtitle">Inicia sesión para continuar</p>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login__form">
        <div class="login__field">
          <label for="username" class="login__label">Email</label>
          <app-input
            id="username"
            type="text"
            placeholder="tu@email.com"
            formControlName="username"
            [fullWidth]="true"
            [error]="username?.invalid && username?.touched ? 'Introduce un email válido' : ''"
          ></app-input>
        </div>

        <div class="login__field">
          <label for="password" class="login__label">Contraseña</label>
          <app-input
            id="password"
            type="password"
            placeholder="Tu contraseña"
            formControlName="password"
            [fullWidth]="true"
            [error]="password?.invalid && password?.touched ? 'La contraseña es requerida' : ''"
          ></app-input>
        </div>

        <app-button
          type="submit"
          [fullWidth]="true"
          [disabled]="loginForm.invalid || isSubmitting"
          variant="primary"
          size="large"
        >
          {{ isSubmitting ? 'Iniciando sesión...' : 'Iniciar sesión' }}
        </app-button>
      </form>

      <div class="login__switch">
        <span class="login__switch-text">¿No tienes cuenta?</span>
        <button class="login__switch-link" type="button" (click)="goToRegister()">
          Crear cuenta
        </button>
      </div>
