<div class="login">
  <div class="login__panel">

    <!-- ══ PANEL IZQUIERDO — ILUSTRACIÓN ══════════════════════════════════ -->
    <app-auth-visual></app-auth-visual>

    <!-- ══ PANEL DERECHO — FORMULARIO ═════════════════════════════════════ -->
    <div class="login__form-panel">

      <div class="login__logo">
        <lucide-angular name="layers" [size]="28" class="login__logo-icon"></lucide-angular>
        <span class="login__logo-text">Deck Archive</span>
      </div>

      <div class="login__header">
        <h1 class="login__title">Crear cuenta</h1>
        <p class="login__subtitle">Únete y empieza a construir tus decks</p>
      </div>

      <form [formGroup]="registerForm" (ngSubmit)="onRegister()" class="login__form">
        <div class="login__field">
          <label for="reg-name" class="login__label">Nombre de usuario</label>
          <app-input
            id="reg-name"
            type="text"
            placeholder="Cómo quieres que te llamen"
            formControlName="displayName"
            [fullWidth]="true"
            [error]="regDisplayName?.invalid && regDisplayName?.touched
              ? (regDisplayName?.errors?.['minlength'] ? 'Mínimo 3 caracteres' : 'Nombre requerido')
              : ''"
          ></app-input>
        </div>

        <div class="login__field">
          <label for="reg-email" class="login__label">Email</label>
          <app-input
            id="reg-email"
            type="text"
            placeholder="tu@email.com"
            formControlName="email"
            [fullWidth]="true"
            [error]="regEmail?.invalid && regEmail?.touched ? 'Introduce un email válido' : ''"
          ></app-input>
        </div>

        <div class="login__field">
          <label for="reg-password" class="login__label">Contraseña</label>
          <app-input
            id="reg-password"
            type="password"
            placeholder="Mínimo 8 caracteres"
            formControlName="password"
            [fullWidth]="true"
            [error]="regPassword?.invalid && regPassword?.touched
              ? (regPassword?.errors?.['minlength'] ? 'Mínimo 8 caracteres' : 'Contraseña requerida')
              : ''"
          ></app-input>
        </div>

        <div class="login__field">
          <label for="reg-confirm" class="login__label">Confirmar contraseña</label>
          <app-input
            id="reg-confirm"
            type="password"
            placeholder="Repite la contraseña"
            formControlName="confirmPassword"
            [fullWidth]="true"
            [error]="passwordsMismatch ? 'Las contraseñas no coinciden' : ''"
          ></app-input>
        </div>

        <app-button
          type="submit"
          [fullWidth]="true"
          [disabled]="registerForm.invalid || isSubmitting"
          variant="primary"
          size="large"
        >
          {{ isSubmitting ? 'Creando cuenta...' : 'Crear cuenta' }}
        </app-button>
      </form>

      <div class="login__switch">
        <span class="login__switch-text">¿Ya tienes cuenta?</span>
        <button class="login__switch-link" type="button" (click)="goToLogin()">
          Iniciar sesión
        </button>
      </div>

    </div>
  </div>
</div>
