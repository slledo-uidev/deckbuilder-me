<div class="decks-library">
  <div class="decks-library__header">
    <div class="decks-library__header-content">
      <h2 class="decks-library__title">Decks Library</h2>
      <app-toggle-switch
        [checked]="showAdvanced"
        label="Advanced Decklist"
        size="medium"
        (toggled)="onToggleAdvanced($event)">
      </app-toggle-switch>
      <p *ngIf="decks.length > 0" class="decks-library__subtitle">{{ decks.length }} {{ decks.length === 1 ? 'deck' : 'decks' }} saved</p>
    </div>

    <app-button variant="primary" size="small" (click)="onCreateNewDeck()">+ Create New Deck</app-button>

  </div>

  <ng-container *ngIf="!showAdvanced">
    <!-- Empty State -->
    <div *ngIf="decks.length === 0" class="decks-library__empty">
      <app-empty-state
        message="No decks saved yet"
        icon="folder"
        size="large">
        <button 
          class="decks-library__btn-empty-action"
          (click)="onCreateNewDeck()">
          Create Your First Deck
        </button>
      </app-empty-state>
    </div>

    <!-- Decks Grid -->
    <div *ngIf="decks.length > 0" class="decks-library__grid">
      <div
        *ngFor="let deck of decks"
        class="deck-card">
        <!-- Card Image -->
        <div class="deck-card__image">
          <img [src]="getPlaceholderImage(deck)" [alt]="deck.name" />
        </div>
        <!-- Card Content -->
        <div class="deck-card__content">
          <h3 class="deck-card__title">{{ deck.name }}</h3>

          <!-- Arquetipo: modo lectura -->
          <div class="deck-card__archetype" *ngIf="editingArchetypeId !== deck.id">
            <span class="deck-card__archetype-badge">
              {{ deck.archetype || 'Unclassified' }}
            </span>
            <button
              class="deck-card__archetype-edit-btn"
              (click)="onStartEditArchetype(deck)"
              title="Edit archetype"
              type="button">
              <lucide-angular name="pencil" [size]="11" class="lucide-icon"></lucide-angular>
            </button>
          </div>

          <!-- Arquetipo: modo edición inline -->
          <div class="deck-card__archetype-edit" *ngIf="editingArchetypeId === deck.id">
            <input
              class="deck-card__archetype-input"
              type="text"
              [(ngModel)]="editingArchetypeValue"
              placeholder="e.g. Agumon..."
              maxlength="60"
              (keydown)="onArchetypeKeydown($event, deck)"
              autofocus />
            <button
              class="deck-card__archetype-save-btn"
              (click)="onSaveArchetype(deck)"
              title="Save"
              type="button">
              <lucide-angular name="check" [size]="11" class="lucide-icon"></lucide-angular>
            </button>
            <button
              class="deck-card__archetype-cancel-btn"
              (click)="onCancelEditArchetype()"
              title="Cancel"
              type="button">
              <lucide-angular name="x" [size]="11" class="lucide-icon"></lucide-angular>
            </button>
          </div>

          <div class="deck-card__meta">
            <span class="deck-card__stats">
              {{ getDigiEggCount(deck) }}/5 Eggs &bull; {{ getMainCount(deck) }}/50 Main
            </span>
            <span class="deck-card__date">{{ formatDate(deck.updatedAt) }}</span>
          </div>
          <div *ngIf="deck.colors.length" class="deck-card__colors">
            <span
              *ngFor="let color of getColorDots(deck)"
              class="deck-card__color-dot"
              [class]="'deck-card__color-dot ' + colorToClass(color)"
              [title]="color">
            </span>
          </div>
          <!-- Actions -->
          <div class="deck-card__actions">
            <app-button
              variant="primary"
              size="small"
              (clicked)="onLoadDeck(deck)">
              Load
            </app-button>
            <app-button
              variant="outline"
              size="small"
              (clicked)="onDuplicateDeck(deck.id)">
              Copy
            </app-button>
            <app-button
              variant="outline"
              size="small"
              (clicked)="onExportDeck(deck.id)">
              Export
            </app-button>
            <app-button
              variant="secondary"
              size="small"
              (clicked)="onDeleteDeck(deck.id)">
              Delete
            </app-button>
          </div>
        </div>
      </div>
    </div>
  </ng-container>

  <ng-container *ngIf="showAdvanced">
    <app-archetype-grid
      [groups]="archetypeGroups"
      [loading]="loading"
      (groupSelected)="onArchetypeSelected($event)">
    </app-archetype-grid>

    <app-archetype-versions-modal
      [group]="selectedGroup"
      [isOpen]="isModalOpen"
      (closed)="onModalClose()"
      (deckAction)="onDeckAction($event)">
    </app-archetype-versions-modal>
  </ng-container>
</div>
